name: Build & Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0). Leave blank to auto-detect."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m unittest discover tests -v

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$(python3 -c "import openstick; print(openstick.__version__)")"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Selected release tag: $TAG"

      - name: Build Pre-Packaged Release ZIP
        run: |
          python scripts/package_release.py --version "${{ steps.release_info.outputs.tag }}"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "OpenStick Installer ${{ steps.release_info.outputs.tag }}"
          files: |
            dist/openstick-installer.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
